<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>የኢትዮጵያ ንግድ ባንክ - የብድር ማመልከቻ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --cbe-purple: #51255e;
            --cbe-hover: #3d1b46;
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-muted: #666666;
            --border-color: #dddddd;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        .app-header {
            width: 100%; background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            height: 60px; padding: 0 20px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
        }

        .back-btn { color: var(--cbe-purple); text-decoration: none; font-weight: 700; font-size: 14px; cursor: pointer; }
        .header-title { font-size: 18px; font-weight: 800; color: var(--cbe-purple); }

        .card {
            background: white; width: 90%; max-width: 440px;
            margin: 20px 0 30px; padding: 30px 24px;
            border-radius: 16px; border: 1px solid var(--border-color);
            display: flex; flex-direction: column;
        }

        .main-title { font-size: 24px; color: var(--text-main); margin: 0 0 6px; text-align: center; font-weight: 800; }
        .subtext { font-size: 13.5px; color: var(--text-muted); text-align: center; margin-bottom: 20px; }

        .step-indicator { display: flex; gap: 8px; margin: 0 auto 28px; width: 80%; }
        .step-bar { flex: 1; height: 4px; background-color: #e2e8f0; border-radius: 2px; }
        .step-bar.active { background-color: var(--cbe-purple); }

        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; }
        .form-group label { font-size: 14px; font-weight: 700; color: #222; margin-bottom: 8px; }

        .form-control {
            font-size: 14px; padding: 14px 16px;
            border: 1px solid var(--border-color); border-radius: 10px;
            background-color: #fff; color: #333; outline: none; width: 100%;
        }
        .form-control:focus { border-color: var(--cbe-purple); }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23555' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: right 16px center; background-size: 14px;
            padding-right: 40px; cursor: pointer;
        }

        textarea.form-control { resize: none; height: 90px; }

        .btn-next {
            background-color: var(--cbe-purple); color: white; border: none;
            width: 100%; padding: 15px; border-radius: 10px;
            font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 10px; text-transform: uppercase;
        }

        .footer-banner { width: 100%; text-align: center; padding: 20px; font-size: 12px; color: #666; margin-top: auto; border-top: 1px solid var(--border-color); }
    </style>
</head>
<body>

<div class="app-header">
    <a href="/" class="back-btn">← ተመለስ</a>
    <div class="header-title">የኢትዮጵያ ንግድ ባንክ</div>
    <div style="width: 30px;"></div>
</div>

<div class="card">
    <h1 class="main-title">የብድር ማመልከቻ</h1>
    <div class="subtext">ደረጃ 1 ከ 3</div>

    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
        <div class="step-bar"></div>
    </div>

    <form id="loanForm" onsubmit="submitStep1(event)">
        <div class="form-group">
            <label for="loanType">የብድር ዓይነት</label>
            <select id="loanType" class="form-control" required>
                <option value="የግል ብድር" selected>የግል ብድር (Personal Loan)</option>
                <option value="የንግድ ብድር">የንግድ ብድር (Business Loan)</option>
                <option value="የትምህርት ብድር">የትምህርት ብድር (Education Loan)</option>
                <option value="የቤት / መኪና ብድር">የቤት / መኪና ብድር</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loanAmt">የብድር መጠን (ብር)</label>
            <input type="number" id="loanAmt" class="form-control" value="100000" required>
        </div>

        <div class="form-group">
            <label for="loanTerm">የብድር ጊዜ (በወራት)</label>
            <select id="loanTerm" class="form-control" required>
                <option value="6 ወራት">6 ወራት</option>
                <option value="12 ወራት" selected>12 ወራት</option>
                <option value="24 ወራት">24 ወራት</option>
                <option value="36 ወራት">36 ወራት</option>
                <option value="48 ወራት">48 ወራት</option>
                <option value="60 ወራት">60 ወራት</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loanPurpose">የብድር መጠቀሚያ μላላ (Purpose)</label>
            <textarea id="loanPurpose" class="form-control" placeholder="ብድሩ ለምን ጉዳይ ይውላል?" required></textarea>
        </div>

        <button type="submit" class="btn-next">ቀጣይ ደረጃ</button>
    </form>
</div>

<div class="footer-banner">© 2026 የኢትዮጵያ ንግድ ባንክ</div>

<script>
    window.onload = () => {
        if (window.Telegram?.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
        const savedAmount = localStorage.getItem('loan_amount') || localStorage.getItem('amount');
        if (savedAmount) document.getElementById('loanAmt').value = savedAmount.replace(/\D/g, '');
    };

    function submitStep1(event) {
        event.preventDefault();
        const loanType = document.getElementById('loanType').value;
        const loanAmt = Number(document.getElementById('loanAmt').value) || 0;
        const loanTermVal = document.getElementById('loanTerm').value;
        const loanPurpose = document.getElementById('loanPurpose').value;
        const months = Number(loanTermVal.replace(/\D/g, '')) || 12;

        const annualRate = 0.095;
        const totalInterest = loanAmt * annualRate * (months / 12);
        const monthlyPayment = Math.round((loanAmt + totalInterest) / months);

        localStorage.setItem('loan_amount', loanAmt);
        localStorage.setItem('loan_term', months);
        localStorage.setItem('monthly_repayment', monthlyPayment);
        localStorage.setItem('appliedLoanType', loanType);
        localStorage.setItem('appliedPurpose', loanPurpose);

        window.location.href = "/page3";
    }
</script>

</body>
</html>
